<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F0"/>
      <stop offset="100%" stop-color="#E5EFE6"/>
    </linearGradient>
    <linearGradient id="liquidSabao" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glassSabao" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="15%" stop-color="#D1FAE5" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#A7F3D0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#1F5B3A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bg2)"/>
  <ellipse cx="300" cy="510" rx="145" ry="24" fill="#1F5B3A" opacity="0.08"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow2)">
    <!-- Cap & Handle -->
    <rect x="250" y="65" width="100" height="38" rx="8" fill="#1F5B3A"/>
    <rect x="245" y="96" width="110" height="12" rx="4" fill="#143D27"/>
    
    <!-- Heavy Jug Handle on Right -->
    <path d="M 370 200 C 440 210 440 370 375 390 L 360 370 C 410 350 410 230 360 215 Z" fill="#E2E8F0" opacity="0.5"/>
    
    <!-- Neck -->
    <rect x="265" y="108" width="70" height="42" fill="url(#glassSabao)"/>
    
    <!-- Body -->
    <path d="M 195 210 C 195 160 245 150 265 150 L 335 150 C 355 150 405 160 405 210 L 405 465 C 405 495 385 510 350 510 L 250 510 C 215 510 195 495 195 465 Z" fill="#E2E8F0" opacity="0.3"/>
    
    <!-- Liquid content -->
    <path d="M 202 235 C 240 230 360 240 398 235 L 398 465 C 398 490 380 504 348 504 L 252 504 C 220 504 202 490 202 465 Z" fill="url(#liquidSabao)"/>
    
    <!-- Highlights -->
    <path d="M 215 240 L 215 480" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <path d="M 195 210 C 195 160 245 150 265 150 L 335 150 C 355 150 405 160 405 210 L 405 465 C 405 495 385 510 350 510 L 250 510 C 215 510 195 495 195 465 Z" fill="url(#glassSabao)"/>
  </g>

  <!-- Eco Paper Label -->
  <g filter="url(#shadow2)">
    <rect x="220" y="270" width="160" height="180" rx="8" fill="#FAF8F0"/>
    <rect x="224" y="274" width="152" height="172" rx="6" fill="none" stroke="#1F5B3A" stroke-width="1.5" stroke-dasharray="4,2"/>
    
    <!-- Logo & Text -->
    <circle cx="300" cy="305" r="16" fill="#1F5B3A"/>
    <path d="M 300 293 C 308 298 312 306 300 317 C 288 306 292 298 300 293 Z" fill="#B88B37"/>
    
    <text x="300" y="340" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#1F5B3A" text-anchor="middle" letter-spacing="1">SABÃO LÍQUIDO</text>
    <text x="300" y="358" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#B88B37" text-anchor="middle">EcoRefil Concentrado</text>
    
    <line x1="245" y1="372" x2="355" y2="372" stroke="#E5EFE6" stroke-width="1.5"/>
    
    <text x="300" y="392" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" fill="#2B362F" text-anchor="middle">Lava Roupas Alta Eficiência</text>
    <text x="300" y="406" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Tensoativo Vegetal</text>
    <text x="300" y="425" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F5B3A" text-anchor="middle">REFIL A GRANEL</text>
  </g>
</svg>
