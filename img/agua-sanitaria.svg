<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F0"/>
      <stop offset="100%" stop-color="#E5EFE6"/>
    </linearGradient>
    <linearGradient id="liquidAgua" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="50%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="glassAgua" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="15%" stop-color="#F3F4F6" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#E5E7EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#1F5B3A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bg3)"/>
  <ellipse cx="300" cy="510" rx="140" ry="24" fill="#1F5B3A" opacity="0.08"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow3)">
    <!-- Security Cap with Red/Gold Ribbing -->
    <rect x="262" y="66" width="76" height="38" rx="8" fill="#B88B37"/>
    <rect x="258" y="98" width="84" height="12" rx="4" fill="#996F26"/>
    
    <!-- Neck -->
    <rect x="270" y="110" width="60" height="42" fill="url(#glassAgua)"/>
    
    <!-- Ribbed ergonomics on shoulder -->
    <path d="M 205 200 C 205 160 250 150 270 150 L 330 150 C 350 150 395 160 395 200 L 395 470 C 395 495 375 510 345 510 L 255 510 C 225 510 205 495 205 470 Z" fill="#F8FAFC" opacity="0.4"/>
    
    <!-- Liquid content -->
    <path d="M 212 230 C 240 225 360 235 388 230 L 388 470 C 388 490 370 504 342 504 L 258 504 C 230 504 212 490 212 470 Z" fill="url(#liquidAgua)"/>
    
    <!-- Highlights -->
    <path d="M 224 230 L 224 480" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M 205 200 C 205 160 250 150 270 150 L 330 150 C 350 150 395 160 395 200 L 395 470 C 395 495 375 510 345 510 L 255 510 C 225 510 205 495 205 470 Z" fill="url(#glassAgua)"/>
  </g>

  <!-- Eco Paper Label -->
  <g filter="url(#shadow3)">
    <rect x="225" y="270" width="150" height="180" rx="8" fill="#FAF8F0"/>
    <rect x="229" y="274" width="142" height="172" rx="6" fill="none" stroke="#1F5B3A" stroke-width="1.5" stroke-dasharray="4,2"/>
    
    <!-- Logo & Text -->
    <circle cx="300" cy="305" r="16" fill="#1F5B3A"/>
    <path d="M 300 293 C 308 298 312 306 300 317 C 288 306 292 298 300 293 Z" fill="#E5EFE6"/>
    
    <text x="300" y="340" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#1F5B3A" text-anchor="middle" letter-spacing="1">ÁGUA SANITÁRIA</text>
    <text x="300" y="358" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#B88B37" text-anchor="middle">EcoRefil 2,5% Ativo</text>
    
    <line x1="250" y1="372" x2="350" y2="372" stroke="#E5EFE6" stroke-width="1.5"/>
    
    <text x="300" y="392" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" fill="#2B362F" text-anchor="middle">Ação Bactericida & Alvejante</text>
    <text x="300" y="406" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Desinfecção Residencial</text>
    <text x="300" y="425" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F5B3A" text-anchor="middle">REFIL A GRANEL</text>
  </g>
</svg>
